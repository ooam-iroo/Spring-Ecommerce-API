spring:
  application:
    name: spring-ecommerce-api

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: ecommerce
    password: ecommerce

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-with-at-least-32-characters}
    expiration: 3600000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info